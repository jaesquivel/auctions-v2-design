# Add this file to compose.yaml for a public hostname with automatic HTTPS.
services:
  caddy:
    image: caddy:2.11.9-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      prototype:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
