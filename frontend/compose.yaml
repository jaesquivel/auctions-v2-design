services:
  auctions-frontend:
    image: auctions-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG Required}
    container_name: auctions-frontend
    platform: linux/amd64
    init: true
    restart: unless-stopped
    env_file:
      - frontend-env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - traefik
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
